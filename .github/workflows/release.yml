# Builds the connector for every platform and publishes a release.
# Version is v1.<run_number>; it cannot collide with the Hue server's.
name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Build
        run: |
          set -eu
          ver="v1.${GITHUB_RUN_NUMBER}"
          echo "ver=$ver" >> "$GITHUB_ENV"
          # CGO off: no cgo in the tree, so both targets cross-compile.
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags "-s -w" -o hue-connector-darwin-arm64  ./cmd/hue-connector
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags "-s -w" -o hue-connector-darwin-amd64  ./cmd/hue-connector
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags "-s -w" -o hue-connector-linux-amd64   ./cmd/hue-connector
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags "-s -w" -o hue-connector-linux-arm64   ./cmd/hue-connector
          sha256sum hue-connector-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$ver" \
            --title "$ver" \
            --target "$GITHUB_SHA" \
            --notes "Connector build from $GITHUB_SHA.

          Assets: \`hue-connector-{darwin,linux}-{amd64,arm64}\` and \`SHA256SUMS\`.

          Add \`/releases/latest\` to a Hue server's update feed to pick this up." \
            hue-connector-darwin-arm64 hue-connector-darwin-amd64 \
            hue-connector-linux-amd64 hue-connector-linux-arm64 SHA256SUMS
